[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-warden"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect",
    "httpx",
    "semgrep>=1.180,<2",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]",
    "hypothesis",
    "import-linter",
    "mutmut>=3.8,<4",
    "mypy",
    "pytest",
    "ruff",
]

[project.scripts]
skill-warden = "skill_warden.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not docker and not live_llm and not packaging and not case_sensitive_fs'"
markers = [
    "docker: needs Docker, including the ClickHouse test container",
    "live_llm: needs a live model API key",
    "packaging: builds and installs a wheel",
    "case_sensitive_fs: needs a case-sensitive filesystem",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/skill_warden"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
exclude = ["mutants"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = [
    "src/skill_warden/__init__.py",
    "src/skill_warden/cli.py",
    "src/skill_warden/errors.py",
    "src/skill_warden/hashing.py",
    "src/skill_warden/history.py",
    "src/skill_warden/memory_store.py",
    "src/skill_warden/models.py",
    "src/skill_warden/paths.py",
    "src/skill_warden/pipeline.py",
    "src/skill_warden/policy.py",
    "src/skill_warden/redact.py",
]

[tool.mutmut]
source_paths = ["src/skill_warden"]
only_mutate = [
    "src/skill_warden/redact.py",
    "src/skill_warden/hashing.py",
]
also_copy = ["scripts/", "fixtures/"]
pytest_add_cli_args_test_selection = [
    "tests/test_redact.py",
    "tests/test_hashing.py",
]

[tool.importlinter]
root_packages = ["skill_warden"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Skill Warden does not import tests or scripts"
type = "forbidden"
source_modules = ["skill_warden"]
forbidden_modules = ["tests", "scripts"]

[[tool.importlinter.contracts]]
name = "Stages do not import the CLI"
type = "forbidden"
source_modules = [
    "skill_warden.semgrep",
    "skill_warden.reader",
    "skill_warden.jail",
]
forbidden_modules = ["skill_warden.cli"]

[tool.skill_warden.core]
files = [
    "src/skill_warden/redact.py",
    "src/skill_warden/hashing.py",
]
